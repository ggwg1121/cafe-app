<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제하기 - 카페 온담</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="./checkout.css" />
</head>
<body>
  <header class="navbar">
    <a href="../index.html" class="navbar-brand"><svg class="brand-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#3a2416" stroke="#c9a15a" stroke-width="1.2"/><path d="M17.5 12.5c-1.2 1.6 1 2.2-0.3 4M22 12.5c-1.2 1.6 1 2.2-0.3 4M26.5 12.5c-1.2 1.6 1 2.2-0.3 4" fill="none" stroke="#c9a15a" stroke-width="1.3" stroke-linecap="round"/><rect x="15" y="20" width="15" height="10" rx="2" fill="none" stroke="#faf3ea" stroke-width="2"/><path d="M30 22h2.2a2.6 2.6 0 0 1 0 5.2H30" fill="none" stroke="#faf3ea" stroke-width="2" stroke-linecap="round"/><line x1="13" y1="33" x2="31" y2="33" stroke="#faf3ea" stroke-width="2" stroke-linecap="round"/></svg> 카페 온담</a>
    <nav class="navbar-links">
      <a href="../menus/list.html">메뉴</a>
      <a href="../basket/list.html">장바구니</a>
      <a href="../orders/list.html">주문내역</a>
      <a href="../my/index.html">마이페이지</a>
      <button id="logout-btn" class="btn btn-secondary">로그아웃</button>
    </nav>
  </header>

  <main class="page">
    <div class="container container-narrow">
      <div class="page-header">
        <h1>결제하기</h1>
      </div>

      <div id="order-summary" class="order-summary card"></div>

      <div id="points-section" class="card points-section">
        <div class="points-section-header">
          <span>보유 포인트</span>
          <span id="points-balance">0P</span>
        </div>
        <div class="field points-use-field">
          <label for="points-input">사용할 포인트</label>
          <div class="points-use-row">
            <input type="number" id="points-input" min="0" step="1" value="0" />
            <button type="button" id="points-max-btn" class="btn btn-secondary">전액사용</button>
          </div>
        </div>
        <div class="points-summary-row">
          <span>포인트 사용</span>
          <span id="points-used-display">-0원</span>
        </div>
        <div class="points-summary-row points-final-total">
          <span>최종 결제 금액</span>
          <span id="final-total">0원</span>
        </div>
      </div>

      <form id="payment-form" class="card payment-form" novalidate>
        <div class="field">
          <label for="cardNumber">카드 번호</label>
          <input
            type="text"
            id="cardNumber"
            inputmode="numeric"
            placeholder="1234 1234 1234 1234"
            maxlength="19"
            required
          />
        </div>
        <div class="field">
          <label for="cardHolder">카드 소유자명</label>
          <input type="text" id="cardHolder" placeholder="홍길동" required />
        </div>
        <p id="payment-error" class="field-error hidden"></p>

        <button type="submit" id="pay-btn" class="btn btn-primary btn-block">결제하기</button>
      </form>

      <p class="text-muted text-center payment-notice">* 실제 결제가 이루어지지 않는 시뮬레이션 화면입니다.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/payment.js"></script>
  <script src="./checkout.js"></script>
</body>
</html>
