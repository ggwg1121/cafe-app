<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메뉴 추가 - 카페 온담 관리자</title>
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="./create.css" />
</head>
<body>
  <header class="navbar">
    <a href="../index.html" class="navbar-brand"><svg class="brand-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#3a2416" stroke="#c9a15a" stroke-width="1.2"/><path d="M17.5 12.5c-1.2 1.6 1 2.2-0.3 4M22 12.5c-1.2 1.6 1 2.2-0.3 4M26.5 12.5c-1.2 1.6 1 2.2-0.3 4" fill="none" stroke="#c9a15a" stroke-width="1.3" stroke-linecap="round"/><rect x="15" y="20" width="15" height="10" rx="2" fill="none" stroke="#faf3ea" stroke-width="2"/><path d="M30 22h2.2a2.6 2.6 0 0 1 0 5.2H30" fill="none" stroke="#faf3ea" stroke-width="2" stroke-linecap="round"/><line x1="13" y1="33" x2="31" y2="33" stroke="#faf3ea" stroke-width="2" stroke-linecap="round"/></svg> 카페 온담 관리자</a>
    <nav class="navbar-links">
      <a href="../index.html">대시보드</a>
      <a href="./list.html" class="active">메뉴</a>
      <a href="../orders/list.html">주문</a>
      <a href="../inventory/list.html">재고</a>
      <a href="../reviews/list.html">리뷰</a>
      <button id="logout-btn" class="btn btn-secondary">로그아웃</button>
    </nav>
  </header>

  <main class="page">
    <div class="container container-narrow">
      <div class="page-header">
        <h1>메뉴 추가</h1>
      </div>

      <form id="menu-form" class="card" novalidate>
        <div class="field">
          <label for="name">메뉴명</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="field">
          <label for="category">카테고리</label>
          <select id="category" name="category" required></select>
        </div>
        <div class="field">
          <label for="price">가격</label>
          <input type="number" id="price" name="price" min="0" step="100" required />
        </div>
        <div class="field">
          <label for="image">이미지 URL</label>
          <input type="url" id="image" name="image" placeholder="https://..." />
        </div>
        <div class="field">
          <label for="description">설명</label>
          <textarea id="description" name="description" rows="3"></textarea>
        </div>
        <div class="field field-checkbox">
          <label><input type="checkbox" id="isSoldOut" name="isSoldOut" /> 품절 상태로 등록</label>
        </div>

        <div class="form-actions">
          <a href="./list.html" class="btn btn-secondary">취소</a>
          <button type="submit" class="btn btn-primary">추가하기</button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabaseClient.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="./create.js"></script>
</body>
</html>
