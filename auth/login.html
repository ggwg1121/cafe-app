<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - 카페 온담</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card card">
      <a href="../index.html" class="auth-logo"><svg class="brand-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#3a2416" stroke="#c9a15a" stroke-width="1.2"/><path d="M17.5 12.5c-1.2 1.6 1 2.2-0.3 4M22 12.5c-1.2 1.6 1 2.2-0.3 4M26.5 12.5c-1.2 1.6 1 2.2-0.3 4" fill="none" stroke="#c9a15a" stroke-width="1.3" stroke-linecap="round"/><rect x="15" y="20" width="15" height="10" rx="2" fill="none" stroke="#faf3ea" stroke-width="2"/><path d="M30 22h2.2a2.6 2.6 0 0 1 0 5.2H30" fill="none" stroke="#faf3ea" stroke-width="2" stroke-linecap="round"/><line x1="13" y1="33" x2="31" y2="33" stroke="#faf3ea" stroke-width="2" stroke-linecap="round"/></svg> 카페 온담</a>

      <h1 class="auth-title">로그인</h1>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="비밀번호" required />
        </div>
        <p id="login-error" class="field-error hidden"></p>

        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>

      <p class="auth-footer text-center text-muted">
        아직 계정이 없으신가요?
        <a href="./signup.html" class="auth-link">회원가입</a>
      </p>
    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="./login.js"></script>
</body>
</html>
